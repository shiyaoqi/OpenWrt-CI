name: JDCloud-ImmortalWrt

on:
  workflow_dispatch:
  workflow_call:
  # schedule:
  #   - cron: "0 18 * * *"

permissions:
  contents: read
  actions: read

jobs:
  Build:
    uses: ./.github/workflows/Build-OpenWrt.yml
    permissions:
      contents: write
      actions: write
    with:
      repo_url: https://github.com/laipeng668/immortalwrt.git
      repo_branch: openwrt-25.12
      config_file: configs/JDCloud.config
      firmware_tag: JDCloud
      kernel_file: kernel-6.12
      artifact_prefix: Arthur.Athena
      manifest_file: immortalwrt-qualcommax-ipq60xx.manifest
      delete_old_workflows: true
      release_summary: >-
        京东云 AX1800 Pro（亚瑟）ImmortalWrt 25.12 固件，6.12 内核 / 全功能 NSS，默认主题 Aurora。
        已固化 ath11k nss_offload=0（修复 WiFi 拿不到 IP），LAN 默认管理地址 192.168.68.1；
        内置 OpenClash（luci feed + Mihomo 内核）与 EasyTier，ZeroTier / PassWall / autoreboot 等已移除；
        上行默认 WAN DHCP + 双频 AP，WAN 直连或 5G 中继由刷机后脚本切换。
        插件清单见 configs/General.config 末尾 v2 段，修复说明见 WB-FIXES.md。
