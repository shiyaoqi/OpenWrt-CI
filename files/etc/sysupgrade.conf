## This file contains files and directories that should
## be preserved during an upgrade.
##
## WorkBuddy 固化清单 (2026-11-08)
## /etc/config/ 下的文件由 OpenWrt conffiles 机制默认保留，无需在此列出。
## 下面列的是「不在 conffiles 里、但丢了就得重配」的关键资产：

# --- 核心修复（换固件后仍要保留 0，防止上游默认值回归）---
/etc/modules.d/ath11k

# --- OpenClash 全套（内核、订阅配置、自定义规则、Geo 数据、策略组状态）---
# 注意：这些不是 conffiles，不写进这里则 sysupgrade 保留配置时也会丢。
/etc/openclash/

# --- 排障留档与回退脚本 ---
/root/README-openclash-wb.txt
/root/README.txt
/root/wb-*.bak
/root/wb-*.sh
/root/wb-openclash-enable-*/
/root/wb-openclash-backup/
/root/wb-google-github-*/
/root/wb-pre-openclash-*.tgz
/root/wb-custom-rules.list.bak

# --- 打印机驱动（沿用原有保留项）---
/opt/p910nd_drivers
/usr/share/luci/menu.d/luci-app-p910nd.json
